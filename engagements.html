<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID GROUP - Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="picocms.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --id-red: #e41e28;
      --id-red-cta: #de0c1a;
      --id-gray-dark: #1b2230;
      --id-gray-neutral: #ededed;
    }
    body {
      font-family: 'Avenir', 'Nunito', sans-serif;
      background-color: var(--id-gray-neutral);
      color: var(--id-gray-dark);
    }
    a,
    button {
      transition: transform 0.25s ease, box-shadow 0.25s ease,
        background-color 0.25s ease, color 0.25s ease, opacity 0.25s ease,
        border-color 0.25s ease;
    }
    a:hover,
    button:hover { transform: translateY(-2px); }
    a:active,
    button:active { transform: translateY(0); }
    .nav-link {
      position: relative;
      padding: 0.85rem 0.85rem;
      border-radius: 999px;
      color: #1b2230;
      font-weight: 700;
      transition: color 0.3s ease, background 0.3s ease, transform 0.2s ease;
    }
    .nav-link::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 6px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #e41e28, #de0c1a);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .nav-link:hover {
      color: #e41e28;
      background: rgba(228, 30, 40, 0.08);
      transform: translateY(-1px);
    }
    .nav-link:hover::after {
      opacity: 1;
      transform: translateY(0);
    }
    .nav-link:focus-visible {
      outline: 2px solid rgba(228, 30, 40, 0.45);
      outline-offset: 6px;
    }
    .logo-link img { transition: transform 0.25s ease; }
    .logo-link:hover img,
    .logo-link:focus-visible img { transform: scale(1.06); }
  </style>
</head>
<body class="min-h-screen bg-[var(--id-gray-neutral)] text-[var(--id-gray-dark)] antialiased">
  <header class="global-nav" role="banner">
    <a class="nav-brand" href="index.html">
      <img src="logos/ID GROUP.png" alt="ID GROUP">
      <span>ID GROUP</span>
      <span class="brand-tooltip" aria-hidden="true">
        <img src="images/batiment73.png" alt="" class="brand-tooltip__image">
        <span>
          <p class="brand-tooltip__heading">ID GROUP</p>
          <p class="brand-tooltip__address">73 rue du Bâtiment<br>Siège de la société</p>
        </span>
      </span>
    </a>
    <nav class="nav-links" aria-label="Navigation principale">
      <a href="index.html">Accueil</a>
      <a href="index.html#universes">Univers</a>
      <a href="groupe.html">Groupe</a>
      <a href="engagements.html">Engagements</a>
      <a href="actualites.html">Actualités</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn icon-only" type="button" data-debug-toggle title="Mode debug" aria-pressed="false" aria-label="Activer le mode debug">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3v3m8-3v3" />
          <path d="M4 8h16" />
          <path d="M4 16h16" />
          <path d="M9 8v4a3 3 0 1 0 6 0V8" />
          <path d="M5 19h14" />
        </svg>
      </button>
      <button class="icon-btn icon-only" type="button" title="Langue" aria-label="Changer de langue">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18" />
          <path d="M12 3a15 15 0 0 1 0 18" />
          <path d="M12 3a15 15 0 0 0 0 18" />
        </svg>
      </button>
      <a class="icon-btn primary" href="contact.html" title="Prendre contact">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5h16v14H4z" />
          <path d="m4 7 8 5 8-5" />
        </svg>
        <span>Contact</span>
      </a>
    </div>
  </header>
  <main class="max-w-4xl mx-auto px-4 py-16 space-y-4">
    <p class="text-xs uppercase tracking-[0.35em] text-red-600">ID Group</p>
    <h1 class="text-4xl font-black">Section en construction</h1>
    <p class="text-lg text-gray-700">Ce gabarit sert de base pour la navigation. Personnalisez ce contenu avec vos informations spécifiques.</p>
    <a href="index.html" class="inline-flex items-center gap-2 px-4 py-2 bg-red-600 text-white rounded-md font-semibold shadow">↩ Retour à l'accueil</a>
  </main>
  <script src="picocms.js"></script>
  <script src="scripts/global.js"></script>
</body>
</html>
