<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID GROUP - Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/nav.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --id-red: #e41e28;
      --id-red-cta: #de0c1a;
      --id-gray-dark: #1b2230;
      --id-gray-neutral: #ededed;
    }
    body {
      font-family: 'Avenir', 'Nunito', sans-serif;
      background-color: var(--id-gray-neutral);
      color: var(--id-gray-dark);
    }
    a,
    button {
      transition: transform 0.25s ease, box-shadow 0.25s ease,
        background-color 0.25s ease, color 0.25s ease, opacity 0.25s ease,
        border-color 0.25s ease;
    }
    a:hover,
    button:hover { transform: translateY(-2px); }
    a:active,
    button:active { transform: translateY(0); }
    .nav-link {
      position: relative;
      padding: 0.85rem 0.85rem;
      border-radius: 999px;
      color: #1b2230;
      font-weight: 700;
      transition: color 0.3s ease, background 0.3s ease, transform 0.2s ease;
    }
    .nav-link::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 6px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #e41e28, #de0c1a);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .nav-link:hover {
      color: #e41e28;
      background: rgba(228, 30, 40, 0.08);
      transform: translateY(-1px);
    }
    .nav-link:hover::after {
      opacity: 1;
      transform: translateY(0);
    }
    .nav-link:focus-visible {
      outline: 2px solid rgba(228, 30, 40, 0.45);
      outline-offset: 6px;
    }
    .logo-link img { transition: transform 0.25s ease; }
    .logo-link:hover img,
    .logo-link:focus-visible img { transform: scale(1.06); }
  </style>
  <script defer src="scripts/navigation.js"></script>
</head>
<body class="min-h-screen bg-[var(--id-gray-neutral)] text-[var(--id-gray-dark)] antialiased">
  <header class="global-nav">
    <div class="nav-shell">
      <a class="nav-logo" href="index.html">
        <img src="logos/ID GROUP.png" alt="Logo ID GROUP">
        <span>ID GROUP</span>
      </a>
      <nav class="nav-links" aria-label="Navigation principale">
        <a href="groupe.html">Le Groupe</a>
        <a href="engagements.html">Engagements</a>
        <a href="home.html">ID HOME</a>
        <a href="pro.html">ID PRO</a>
        <a href="agri.html">ID AGRI</a>
        <a href="actualites.html">Actualités</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-button" type="button" data-debug-toggle aria-pressed="false" title="Activer le mode debug">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5v1.25m-3.25-7.5A3.25 3.25 0 1 1 12 13.5m-3.25-3.25 1.8 1.8m-1.8-1.8-1.8 1.8M12 7.5V6.25m6.25 3.25A6.25 6.25 0 1 1 12 3m6.25 6.5-1.8 1.8m1.8-1.8 1.8 1.8" />
          </svg>
          <span class="sr-only">Mode debug</span>
        </button>
        <button class="icon-button" type="button" title="Changer de langue">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18m0 0c4.97 0 9-4.03 9-9s-4.03-9-9-9m0 18c-4.97 0-9-4.03-9-9s4.03-9 9-9m0 0c0 4.97 4.03 9 9 9m-9-9c0 4.97-4.03 9-9 9" />
          </svg>
          <span class="sr-only">Langue</span>
        </button>
        <a class="icon-button" href="contact.html" title="Prendre contact">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75 12 12l8.25-5.25m-16.5 0 8.25 5.25m-8.25-5.25v10.5L12 18m0 0 8.25-6.75V6.75m-8.25 11.25V12" />
          </svg>
          <span class="sr-only">Contact</span>
        </a>
      </div>
    </div>
  </header>
  <main class="max-w-4xl mx-auto px-4 py-16 space-y-4">
    <p class="text-xs uppercase tracking-[0.35em] text-red-600">ID Group</p>
    <h1 class="text-4xl font-black">Section en construction</h1>
    <p class="text-lg text-gray-700">Ce gabarit sert de base pour la navigation. Personnalisez ce contenu avec vos informations spécifiques.</p>
    <a href="index.html" class="inline-flex items-center gap-2 px-4 py-2 bg-red-600 text-white rounded-md font-semibold shadow-md">↩ Retour à l'accueil</a>
  </main>
</body>
</html>
