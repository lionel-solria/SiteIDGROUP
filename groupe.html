<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID GROUP - Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/navigation.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --id-red: #e41e28;
      --id-red-cta: #de0c1a;
      --id-gray-dark: #1b2230;
      --id-gray-neutral: #ededed;
    }
    body {
      font-family: 'Avenir', 'Nunito', sans-serif;
      background-color: var(--id-gray-neutral);
      color: var(--id-gray-dark);
    }
    a,
    button {
      transition: transform 0.25s ease, box-shadow 0.25s ease,
        background-color 0.25s ease, color 0.25s ease, opacity 0.25s ease,
        border-color 0.25s ease;
    }
    a:hover,
    button:hover { transform: translateY(-2px); }
    a:active,
    button:active { transform: translateY(0); }
    .nav-link {
      position: relative;
      padding: 0.85rem 0.85rem;
      border-radius: 999px;
      color: #1b2230;
      font-weight: 700;
      transition: color 0.3s ease, background 0.3s ease, transform 0.2s ease;
    }
    .nav-link::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 6px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #e41e28, #de0c1a);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .nav-link:hover {
      color: #e41e28;
      background: rgba(228, 30, 40, 0.08);
      transform: translateY(-1px);
    }
    .nav-link:hover::after {
      opacity: 1;
      transform: translateY(0);
    }
    .nav-link:focus-visible {
      outline: 2px solid rgba(228, 30, 40, 0.45);
      outline-offset: 6px;
    }
    .logo-link img { transition: transform 0.25s ease; }
    .logo-link:hover img,
    .logo-link:focus-visible img { transform: scale(1.06); }
  </style>
</head>
<body class="min-h-screen bg-[var(--id-gray-neutral)] text-[var(--id-gray-dark)] antialiased">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-brand" href="index.html">
        <img src="logos/ID GROUP.png" alt="Logo ID GROUP">
        <div class="brand-text">
          <span class="brand-name">ID GROUP</span>
          <span class="brand-tag">Protection globale</span>
        </div>
      </a>
      <nav class="site-nav" aria-label="Navigation principale">
        <a href="index.html#universes">Nos univers</a>
        <a href="groupe.html">Groupe</a>
        <a href="engagements.html">Engagements</a>
        <a href="home.html">ID Home</a>
        <a href="pro.html">ID Pro</a>
        <a href="agri.html">ID Agri</a>
        <a href="actualites.html">Actualités</a>
        <a href="contact.html">Contact</a>
        <button type="button" class="nav-debug" data-debug-toggle aria-pressed="false">Debug</button>
      </nav>
      <div class="site-header__actions">
        <span class="location-pill">France • Europe</span>
        <a class="nav-cta" href="contact.html">Prendre contact</a>
      </div>
    </div>
  </header>
  <main class="max-w-4xl mx-auto px-4 py-16 space-y-4">
    <p class="text-xs uppercase tracking-[0.35em] text-red-600">ID Group</p>
    <h1 class="text-4xl font-black">Section en construction</h1>
    <p class="text-lg text-gray-700">Ce gabarit sert de base pour la navigation. Personnalisez ce contenu avec vos informations spécifiques.</p>
    <a href="index.html" class="inline-flex items-center gap-2 px-4 py-2 bg-red-600 text-white rounded-xl font-semibold">↩ Retour à l'accueil</a>
  </main>
  <script src="scripts/navigation.js"></script>
</body>
</html>
