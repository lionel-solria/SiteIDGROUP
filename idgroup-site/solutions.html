<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nos solutions - ID GROUP</title>
  <meta name="description" content="Choisissez ID Home, ID Pro ou ID Agri selon votre contexte.">
  <meta property="og:title" content="Solutions ID GROUP">
  <meta property="og:description" content="Hygiène, sécurité, confort, performance.">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="hero container">
      <p class="badge">Solutions</p>
      <h1 data-i18n="solutions.title">Nos univers, une promesse commune</h1>
      <p data-i18n="solutions.intro">Choisissez l'univers qui correspond...</p>
    </section>

    <section class="section">
      <div class="container cards">
        <article class="card" style="border-top: 4px solid var(--color-home);">
          <h3 data-i18n="solutions.cards.home.title">ID Home</h3>
          <p class="muted" data-i18n="solutions.cards.home.text"></p>
          <a class="cta-inline" href="./id-home.html">ID Home</a>
        </article>
        <article class="card" style="border-top: 4px solid var(--color-pro);">
          <h3 data-i18n="solutions.cards.pro.title">ID Pro</h3>
          <p class="muted" data-i18n="solutions.cards.pro.text"></p>
          <a class="cta-inline" href="./id-pro.html">ID Pro</a>
        </article>
        <article class="card" style="border-top: 4px solid var(--color-agri);">
          <h3 data-i18n="solutions.cards.agri.title">ID Agri</h3>
          <p class="muted" data-i18n="solutions.cards.agri.text"></p>
          <a class="cta-inline" href="./id-agri.html">ID Agri</a>
        </article>
      </div>
    </section>

    <section class="section" id="chooser">
      <div class="container story">
        <div>
          <h2 data-i18n="solutions.chooser.title">Choisir votre univers</h2>
          <p class="muted" data-i18n="solutions.chooser.text"></p>
          <div class="cards">
            <div class="card">
              <h3>Home</h3>
              <p data-i18n="solutions.cards.home.text"></p>
            </div>
            <div class="card">
              <h3>Pro</h3>
              <p data-i18n="solutions.cards.pro.text"></p>
            </div>
            <div class="card">
              <h3>Agri</h3>
              <p data-i18n="solutions.cards.agri.text"></p>
            </div>
          </div>
        </div>
        <div class="hero-illustration">
          <img src="./assets/univers-plan.svg" alt="Plan des univers">
        </div>
      </div>
    </section>
  </main>
  <footer class="footer" id="site-footer"></footer>
  <script src="./js/app.js"></script>
  <script src="./js/i18n.js"></script>
</body>
</html>
