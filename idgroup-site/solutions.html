<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="" />
  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <title>Solutions - ID GROUP</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="solutions">
  <header>
    <div class="navbar container">
      <div class="logo">ID GROUP</div>
      <nav>
        <ul>
          <li><a href="le-groupe.html" data-i18n="nav.group"></a></li>
          <li><a href="rse.html" data-i18n="nav.rse"></a></li>
          <li><a href="solutions.html" data-i18n="nav.solutions"></a></li>
          <li><a href="actus.html" data-i18n="nav.news"></a></li>
          <li><a href="contact.html" data-i18n="nav.contact"></a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <select id="lang-select" class="language-select" aria-label="Langue">
          <option value="fr">FR</option><option value="en">EN</option><option value="de">DE</option>
        </select>
        <a class="button primary" href="espace-client.html" data-i18n="nav.clientArea"></a>
        <button class="burger" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section hero">
      <h1 data-i18n="solutions.title"></h1>
      <p data-i18n="solutions.intro"></p>
    </section>

    <section class="section cards">
      <div class="card" style="border-color:var(--color-home);">
        <h2 data-i18n="solutions.cards.home.title"></h2>
        <p data-i18n="solutions.cards.home.text"></p>
        <a class="button ghost" href="id-home.html" data-i18n="solutions.cta"></a>
      </div>
      <div class="card" style="border-color:var(--color-pro);">
        <h2 data-i18n="solutions.cards.pro.title"></h2>
        <p data-i18n="solutions.cards.pro.text"></p>
        <a class="button ghost" href="id-pro.html" data-i18n="solutions.cta"></a>
      </div>
      <div class="card" style="border-color:var(--color-agri);">
        <h2 data-i18n="solutions.cards.agri.title"></h2>
        <p data-i18n="solutions.cards.agri.text"></p>
        <a class="button ghost" href="id-agri.html" data-i18n="solutions.cta"></a>
      </div>
    </section>

    <section class="section highlight">
      <h2 data-i18n="solutions.contextTitle"></h2>
      <p data-i18n="solutions.contextText"></p>
      <div class="cards">
        <div class="card">Home → confort & hygiène</div>
        <div class="card">Pro → sécurité & propreté</div>
        <div class="card">Agri → bien-être animal</div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">
      <div>© ID GROUP</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <a href="#" data-i18n="footer.legal"></a>
        <a href="#" data-i18n="footer.privacy"></a>
        <a href="#" data-i18n="footer.social"></a>
        <a href="sitemap.xml" data-i18n="footer.sitemap"></a>
      </div>
      <select id="lang-select-footer" class="language-select" aria-label="Langue">
        <option value="fr">FR</option><option value="en">EN</option><option value="de">DE</option>
      </select>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    const footerSelect = document.querySelector('#lang-select-footer');
    const headerSelect = document.querySelector('#lang-select');
    if (footerSelect && headerSelect) {
      footerSelect.addEventListener('change', (e) => { headerSelect.value = e.target.value; headerSelect.dispatchEvent(new Event('change')); footerSelect.value = headerSelect.value; });
      headerSelect.addEventListener('change', () => { footerSelect.value = headerSelect.value; });
    }
  </script>
</body>
</html>
