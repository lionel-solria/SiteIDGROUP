<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualités</title>
  <meta name="description" content="Actualités ID GROUP">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand"><div class="logo-placeholder" aria-hidden="true"></div><span>ID GROUP</span></div>
      <nav aria-label="Navigation principale">
        <a data-i18n="common.nav.group" data-keep-lang href="le-groupe.html">Le Groupe</a>
        <a data-i18n="common.nav.rse" data-keep-lang href="rse.html">RSE</a>
        <a data-i18n="common.nav.solutions" data-keep-lang href="solutions.html">Solutions</a>
        <a data-i18n="common.nav.news" data-keep-lang href="actus.html">Actualités</a>
        <a data-i18n="common.nav.contact" data-keep-lang href="contact.html">Contact</a>
        <a class="cta-client" data-i18n="common.ctaClient" data-keep-lang href="espace-client.html">Espace Client</a>
      </nav>
      <div class="lang-switch" aria-label="Changer de langue"><button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="de">DE</button></div>
      <button class="burger" aria-expanded="false" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
    <div class="mobile-nav" aria-label="Navigation mobile">
      <a data-i18n="common.nav.group" data-keep-lang href="le-groupe.html">Le Groupe</a>
      <a data-i18n="common.nav.rse" data-keep-lang href="rse.html">RSE</a>
      <a data-i18n="common.nav.solutions" data-keep-lang href="solutions.html">Solutions</a>
      <a data-i18n="common.nav.news" data-keep-lang href="actus.html">Actualités</a>
      <a data-i18n="common.nav.contact" data-keep-lang href="contact.html">Contact</a>
      <a class="cta-client" data-i18n="common.ctaClient" data-keep-lang href="espace-client.html">Espace Client</a>
    </div>
  </header>

  <main>
    <section class="section">
      <h1 data-i18n="home.newsTitle">Actualités</h1>
      <div class="filters" id="news-filters"></div>
      <div class="cards" id="news-list"></div>
      <script type="application/json" data-news></script>
    </section>
  </main>

  <footer>
    <div class="cols">
      <div><h3 data-i18n="common.footer.title">ID GROUP</h3></div>
      <div class="site-map">
        <strong data-i18n="common.footer.sitemap">Plan du site</strong>
        <a data-keep-lang href="solutions.html" data-i18n="common.nav.solutions"></a>
        <a data-keep-lang href="actus.html" data-i18n="common.nav.news"></a>
        <a data-keep-lang href="contact.html" data-i18n="common.nav.contact"></a>
      </div>
    </div>
  </footer>
  <script src="js/app.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const lang = new URLSearchParams(window.location.search).get('lang') || localStorage.getItem('idgroup-lang') || 'fr';
      fetch(`data/content.${lang}.json`).then(r=>r.json()).then(data => {
        const filters = document.getElementById('news-filters');
        data.news.filters.forEach(f => {
          const btn = document.createElement('button');
          btn.dataset.category = f.id;
          btn.textContent = f.label;
          if (f.id === 'all') btn.classList.add('active');
          filters.appendChild(btn);
        });
        document.querySelector('script[data-news]').textContent = JSON.stringify(data.news.articles);
      });
    });
  </script>
</body>
</html>
