<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - ID GROUP</title>
  <meta name="description" content="Formulaire de contact ID GROUP.">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="hero container">
      <p class="badge" data-i18n="nav.contact">Contact</p>
      <h1 data-i18n="contact.title">Parlons de votre contexte</h1>
      <p class="muted" data-i18n="contact.intro"></p>
    </section>
    <section class="section">
      <div class="container">
        <div id="contact-success" class="alert hidden" data-i18n="contact.success">Merci ! Votre demande est enregistrée.</div>
        <form class="contact-form" id="contact-form">
          <div>
            <label for="name" data-i18n="contact.fields.name">Nom</label>
            <input id="name" name="name" required placeholder="Votre nom" data-i18n="contact.fields.name">
          </div>
          <div>
            <label for="email" data-i18n="contact.fields.email">Email</label>
            <input id="email" type="email" name="email" required placeholder="Email" data-i18n="contact.fields.email">
          </div>
          <div>
            <label for="profile" data-i18n="contact.fields.profile">Profil</label>
            <select id="profile" name="profile" required>
              <option value="" disabled selected>Choisir</option>
              <option>Particulier</option>
              <option>Professionnel</option>
              <option>Agriculteur</option>
            </select>
          </div>
          <div>
            <label for="universe" data-i18n="contact.fields.universe">Univers</label>
            <select id="universe" name="universe" required>
              <option value="" disabled selected>Choisir</option>
              <option>ID Home</option>
              <option>ID Pro</option>
              <option>ID Agri</option>
            </select>
          </div>
          <div>
            <label for="need" data-i18n="contact.fields.need">Votre besoin</label>
            <input id="need" name="need" required placeholder="Exprimez votre besoin">
          </div>
          <div>
            <label for="message" data-i18n="contact.fields.message">Message</label>
            <textarea id="message" name="message" rows="4" placeholder="Précisions"></textarea>
          </div>
          <button class="cta-btn" type="submit" data-i18n="contact.submit">Envoyer</button>
        </form>
      </div>
    </section>
  </main>
  <footer class="footer" id="site-footer"></footer>
  <script src="./js/app.js"></script>
  <script src="./js/i18n.js"></script>
</body>
</html>
