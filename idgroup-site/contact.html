<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="global.nav.contact">Contact</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .contact-form {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="section container">
        <h1 style="text-align:center;" data-i18n="contact.title">Contactez-nous</h1>
        <form id="contact-form" class="contact-form">
            <div class="form-group">
                <label for="name" data-i18n="contact.name">Nom</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email" data-i18n="contact.email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
             <div class="form-group">
                <label>Univers</label>
                <select name="universe">
                    <option value="">-- Choisir --</option>
                    <option value="home">ID HOME</option>
                    <option value="pro">ID PRO</option>
                    <option value="agri">ID AGRI</option>
                </select>
            </div>
            <div class="form-group">
                <label for="message" data-i18n="contact.message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn-cta" style="width:100%;" data-i18n="contact.send">Envoyer</button>
        </form>
    </div>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
