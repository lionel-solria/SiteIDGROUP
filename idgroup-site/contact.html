<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="" />
  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <title>Contact - ID GROUP</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <header>
    <div class="navbar container">
      <div class="logo">ID GROUP</div>
      <nav>
        <ul>
          <li><a href="le-groupe.html" data-i18n="nav.group"></a></li>
          <li><a href="rse.html" data-i18n="nav.rse"></a></li>
          <li><a href="solutions.html" data-i18n="nav.solutions"></a></li>
          <li><a href="actus.html" data-i18n="nav.news"></a></li>
          <li><a href="contact.html" data-i18n="nav.contact"></a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <select id="lang-select" class="language-select" aria-label="Langue">
          <option value="fr">FR</option><option value="en">EN</option><option value="de">DE</option>
        </select>
        <a class="button primary" href="espace-client.html" data-i18n="nav.clientArea"></a>
        <button class="burger" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section hero">
      <h1 data-i18n="contact.title"></h1>
    </section>
    <section class="section">
      <form id="contact-form">
        <label data-i18n="contact.profile"></label>
        <select name="profile">
          <option value="" disabled selected hidden>--</option>
          <option data-i18n="contact.profileOptions.0"></option>
          <option data-i18n="contact.profileOptions.1"></option>
          <option data-i18n="contact.profileOptions.2"></option>
        </select>

        <label data-i18n="contact.universe"></label>
        <select name="universe">
          <option value="" disabled selected hidden>--</option>
          <option>ID Home</option>
          <option>ID Pro</option>
          <option>ID Agri</option>
        </select>

        <label data-i18n="contact.need"></label>
        <textarea name="need" rows="4" data-i18n-placeholder="contact.need"></textarea>

        <button type="submit" class="button primary" data-i18n="contact.submit"></button>
        <div class="form-message" data-success="" data-error="" data-i18n=""></div>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">
      <div>© ID GROUP</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <a href="#" data-i18n="footer.legal"></a>
        <a href="#" data-i18n="footer.privacy"></a>
        <a href="#" data-i18n="footer.social"></a>
        <a href="sitemap.xml" data-i18n="footer.sitemap"></a>
      </div>
      <select id="lang-select-footer" class="language-select" aria-label="Langue">
        <option value="fr">FR</option><option value="en">EN</option><option value="de">DE</option>
      </select>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    const footerSelect = document.querySelector('#lang-select-footer');
    const headerSelect = document.querySelector('#lang-select');
    if (footerSelect && headerSelect) {
      footerSelect.addEventListener('change', (e) => { headerSelect.value = e.target.value; headerSelect.dispatchEvent(new Event('change')); footerSelect.value = headerSelect.value; });
      headerSelect.addEventListener('change', () => { footerSelect.value = headerSelect.value; });
    }
    async function updateMessages(lang) {
      const message = document.querySelector('.form-message');
      if (!message) return;
      const data = await fetch(`data/content.${lang}.json`).then(r=>r.json());
      message.dataset.success = data.contact.success;
      message.dataset.error = data.contact.error;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const initialLang = localStorage.getItem('idgroup-lang') || 'fr';
      updateMessages(initialLang);
      const headerSelect = document.querySelector('#lang-select');
      headerSelect?.addEventListener('change', (e) => updateMessages(e.target.value));
    });
  </script>
</body>
</html>
