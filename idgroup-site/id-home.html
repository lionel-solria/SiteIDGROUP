<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="global.title">ID GROUP - ID HOME</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .hero-univ {
            background-color: var(--color-home);
            color: white;
            padding: 100px 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <section class="hero-univ">
        <h1 data-i18n="home.blades.home.title">ID HOME</h1>
        <p data-i18n="home.blades.home.desc">Solutions Habitat</p>
    </section>

    <section class="section container">
        <h2 data-i18n="univers.hotspots_title">Nos solutions interactives</h2>
        <div class="hotspot-container">
            <!-- Placeholder Sketch -->
            <div style="width:100%; height:500px; background:#f0f0f0; position:relative;">
                <img src="assets/house-sketch.jpg" alt="House Sketch" class="hotspot-img" style="width:100%; height:100%; object-fit:cover; opacity:0.5;">

                <!-- Hotspots -->
                <div class="hotspot-point" style="top: 30%; left: 40%;" data-info="Solution Isolation : Performance thermique optimale."></div>
                <div class="hotspot-point" style="top: 60%; left: 70%;" data-info="Solution Jardin : Aménagement extérieur durable."></div>
            </div>
        </div>
    </section>

    <div class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>Détail Solution</h3>
            <p class="modal-body">...</p>
            <a href="contact.html" class="btn-cta" data-i18n="univers.modal_cta">Nous contacter</a>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
