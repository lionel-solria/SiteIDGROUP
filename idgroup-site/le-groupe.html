<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Groupe - ID GROUP</title>
  <meta name="description" content="Mission, valeurs et histoire d'ID GROUP.">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="hero container">
      <p class="badge">Le Groupe</p>
      <h1 data-i18n="group.title">Le Groupe</h1>
      <p class="muted" data-i18n="group.mission"></p>
    </section>

    <section class="section">
      <div class="container story">
        <div>
          <h2>Histoire</h2>
          <p class="muted" data-i18n="group.history"></p>
          <h3>Sites & Marques</h3>
          <ul class="sitemap">
            <li data-i18n="group.sites.0"></li>
            <li data-i18n="group.sites.1"></li>
            <li data-i18n="group.sites.2"></li>
          </ul>
          <p class="badge" data-i18n="group.brands.0">ID Home</p>
          <p class="badge" data-i18n="group.brands.1">ID Pro</p>
          <p class="badge" data-i18n="group.brands.2">ID Agri</p>
        </div>
        <div class="hero-illustration">
          <img src="./assets/atelier-sketch.svg" alt="Croquis industriel">
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2>Valeurs</h2>
        <div class="cards">
          <div class="card" data-i18n="group.values.0">Utilité</div>
          <div class="card" data-i18n="group.values.1">Proximité</div>
          <div class="card" data-i18n="group.values.2">Pragmatisme</div>
          <div class="card" data-i18n="group.values.3">Impact positif</div>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer" id="site-footer"></footer>
  <script src="./js/app.js"></script>
  <script src="./js/i18n.js"></script>
</body>
</html>
