<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="global.title">ID GROUP - ID PRO</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .hero-univ {
            background-color: var(--color-pro);
            color: white;
            padding: 100px 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <section class="hero-univ">
        <h1 data-i18n="home.blades.pro.title">ID PRO</h1>
        <p data-i18n="home.blades.pro.desc">Solutions Industrie</p>
    </section>

    <section class="section container">
        <h2 data-i18n="univers.hotspots_title">Nos solutions interactives</h2>
        <div class="hotspot-container">
            <div style="width:100%; height:500px; background:#e0e8f0; position:relative;">
                 <img src="assets/factory-sketch.jpg" alt="Factory Sketch" class="hotspot-img" style="width:100%; height:100%; object-fit:cover; opacity:0.5;">
                <div class="hotspot-point" style="top: 40%; left: 30%;" data-info="Protection Machines : Sécurité renforcée."></div>
                <div class="hotspot-point" style="top: 50%; left: 60%;" data-info="Sol Industriel : Résistance et hygiène."></div>
            </div>
        </div>
    </section>

    <div class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>Détail Solution</h3>
            <p class="modal-body">...</p>
            <a href="contact.html" class="btn-cta" data-i18n="univers.modal_cta">Nous contacter</a>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
