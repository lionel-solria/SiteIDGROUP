<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID Pro - ID GROUP</title>
  <meta name="description" content="Univers ID Pro : sécurité et performance.">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="hero container">
      <p class="badge">ID Pro</p>
      <h1 data-i18n="univers.pro.hero">ID Pro : fiabilité opérationnelle</h1>
      <p class="muted">Solutions pour des environnements de travail sûrs et efficaces.</p>
    </section>
    <section class="section">
      <div class="container">
        <div class="hotspot-area">
          <img src="./assets/univers-plan.svg" alt="Plan site pro" class="hotspot-image">
          <button class="hotspot pro" style="top:32%;left:22%;" data-universe="pro" data-zone="warehouse" aria-label="Logistique" tabindex="0"></button>
          <button class="hotspot pro" style="top:45%;left:48%;" data-universe="pro" data-zone="office" aria-label="Bureaux" tabindex="0"></button>
          <button class="hotspot pro" style="top:68%;left:70%;" data-universe="pro" data-zone="atelier" aria-label="Atelier" tabindex="0"></button>
        </div>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <h2>Cas clients</h2>
        <ul class="sitemap">
          <li data-i18n="univers.pro.stories.0">Réseau retail : 120 magasins harmonisés</li>
          <li data-i18n="univers.pro.stories.1">Site industriel : incidents divisés par 2</li>
        </ul>
      </div>
    </section>
  </main>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <button class="modal-close" aria-label="Fermer">×</button>
      <h3 class="modal-title">Solution</h3>
      <p class="modal-body">Détails de la zone.</p>
      <a class="cta-btn" href="./contact.html">Parler à un expert</a>
    </div>
  </div>
  <footer class="footer" id="site-footer"></footer>
  <script src="./js/app.js"></script>
  <script src="./js/i18n.js"></script>
</body>
</html>
