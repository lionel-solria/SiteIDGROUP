<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="global.title">ID GROUP</title>
    <meta name="description" content="ID GROUP Corporate Site" data-i18n="global.description">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Hero Slider -->
    <section class="hero-slider">
        <div class="blade home" data-link="id-home.html">
            <div class="blade-content">
                <h2 data-i18n="home.blades.home.title">ID HOME</h2>
                <p data-i18n="home.blades.home.desc">Habitat</p>
                <a href="id-home.html" class="blade-cta" data-i18n="home.blades.home.cta">Découvrir</a>
            </div>
        </div>
        <div class="blade pro" data-link="id-pro.html">
            <div class="blade-content">
                <h2 data-i18n="home.blades.pro.title">ID PRO</h2>
                <p data-i18n="home.blades.pro.desc">Industrie</p>
                <a href="id-pro.html" class="blade-cta" data-i18n="home.blades.pro.cta">Découvrir</a>
            </div>
        </div>
        <div class="blade agri" data-link="id-agri.html">
            <div class="blade-content">
                <h2 data-i18n="home.blades.agri.title">ID AGRI</h2>
                <p data-i18n="home.blades.agri.desc">Agriculture</p>
                <a href="id-agri.html" class="blade-cta" data-i18n="home.blades.agri.cta">Découvrir</a>
            </div>
        </div>
    </section>

    <!-- Why Us -->
    <section class="section container">
        <h2 data-i18n="home.why_us.title">Pourquoi ID GROUP ?</h2>
        <div class="grid-3">
            <div class="card">
                <h3 data-i18n="home.why_us.items.0">Fabrication</h3>
                <p>100% Made in France</p>
            </div>
            <div class="card">
                <h3 data-i18n="home.why_us.items.1">Réactivité</h3>
                <p>Service client dédié</p>
            </div>
            <div class="card">
                <h3 data-i18n="home.why_us.items.3">RSE</h3>
                <p>Engagement durable</p>
            </div>
        </div>
    </section>

    <!-- Wormhout -->
    <section class="section section-grey">
        <div class="container">
            <h2 data-i18n="home.wormhout.title">Savoir-faire</h2>
            <p data-i18n="home.wormhout.text">Wormhout...</p>
            <!-- Placeholder for illustration -->
            <div style="width:100%; height:300px; background:#ddd; margin-top:20px; display:flex; align-items:center; justify-content:center;">
                Sketch Illustration: Factory
            </div>
        </div>
    </section>

    <!-- RSE Teaser -->
    <section class="section container">
        <h2 data-i18n="home.rse.title">Positiv'ID</h2>
        <p data-i18n="home.rse.text">RSE</p>
        <a href="rse.html" class="btn-cta" data-i18n="home.rse.cta">En savoir plus</a>
    </section>

    <!-- Scripts -->
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
