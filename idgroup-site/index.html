  <footer class="footer">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">

      <div style="display:flex;gap:12px;flex-wrap:wrap;">

      <select id="lang-select-footer" class="language-select" aria-label="Langue">

      </select>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    const footerSelect = document.querySelector('#lang-select-footer');
    const headerSelect = document.querySelector('#lang-select');
    if (footerSelect && headerSelect) {
      footerSelect.addEventListener('change', (e) => { headerSelect.value = e.target.value; headerSelect.dispatchEvent(new Event('change')); footerSelect.value = headerSelect.value; });
      headerSelect.addEventListener('change', () => { footerSelect.value = headerSelect.value; });
    }
  </script>
  <script src="js/i18n.js"></script>
  <script>
    async function renderProofs(lang) {
      const proofs = document.getElementById('proofs');
      if (!proofs) return;
      const res = await fetch(`data/content.${lang}.json`);
      const data = await res.json();
      proofs.innerHTML = '';
      data.home.proofs.forEach(item => {
        const li = document.createElement('li');
        li.className = 'tag';
        li.textContent = item;
        proofs.appendChild(li);
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const lang = localStorage.getItem('idgroup-lang') || 'fr';
      await renderProofs(lang);
      const headerSelect = document.querySelector('#lang-select');
      headerSelect?.addEventListener('change', (e) => renderProofs(e.target.value));
    });
  </script>
</body>
</html>
