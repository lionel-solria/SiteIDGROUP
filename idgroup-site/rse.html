<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engagements RSE - ID GROUP</title>
  <meta name="description" content="Engagements Positiv'ID : preuves et chiffres.">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="hero container">
      <p class="badge">RSE</p>
      <h1 data-i18n="rse.title">Nos engagements Positiv'ID</h1>
      <p class="muted" data-i18n="rse.intro"></p>
    </section>

    <section class="section">
      <div class="container cards">
        <article class="card" data-i18n="rse.pillars.0.title">
          <h3 data-i18n="rse.pillars.0.title">Matériaux responsables</h3>
          <p class="muted" data-i18n="rse.pillars.0.text"></p>
        </article>
        <article class="card">
          <h3 data-i18n="rse.pillars.1.title">Énergie maîtrisée</h3>
          <p class="muted" data-i18n="rse.pillars.1.text"></p>
        </article>
        <article class="card">
          <h3 data-i18n="rse.pillars.2.title">Économie circulaire</h3>
          <p class="muted" data-i18n="rse.pillars.2.text"></p>
        </article>
        <article class="card">
          <h3 data-i18n="rse.pillars.3.title">Inclusion</h3>
          <p class="muted" data-i18n="rse.pillars.3.text"></p>
        </article>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2>Chiffres clés</h2>
        <div class="metrics" id="rse-metrics"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2>Téléchargements</h2>
        <ul class="sitemap">
          <li data-i18n="rse.downloads.0"></li>
          <li data-i18n="rse.downloads.1"></li>
          <li data-i18n="rse.downloads.2"></li>
        </ul>
      </div>
    </section>
  </main>
  <footer class="footer" id="site-footer"></footer>
  <script src="./js/app.js"></script>
  <script src="./js/i18n.js"></script>
</body>
</html>
