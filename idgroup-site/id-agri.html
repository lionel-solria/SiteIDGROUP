<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="global.title">ID GROUP - ID AGRI</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .hero-univ {
            background-color: var(--color-agri);
            color: white;
            padding: 100px 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <section class="hero-univ">
        <h1 data-i18n="home.blades.agri.title">ID AGRI</h1>
        <p data-i18n="home.blades.agri.desc">Solutions Agriculture</p>
    </section>

    <section class="section container">
        <h2 data-i18n="univers.hotspots_title">Nos solutions interactives</h2>
        <div class="hotspot-container">
            <div style="width:100%; height:500px; background:#eaf0e0; position:relative;">
                 <img src="assets/farm-sketch.jpg" alt="Farm Sketch" class="hotspot-img" style="width:100%; height:100%; object-fit:cover; opacity:0.5;">
                <div class="hotspot-point" style="top: 50%; left: 50%;" data-info="Confort Animal : Amélioration du rendement."></div>
                <div class="hotspot-point" style="top: 20%; left: 80%;" data-info="Stockage : Préservation des récoltes."></div>
            </div>
        </div>
    </section>

    <div class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>Détail Solution</h3>
            <p class="modal-body">...</p>
            <a href="contact.html" class="btn-cta" data-i18n="univers.modal_cta">Nous contacter</a>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
