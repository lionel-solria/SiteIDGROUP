<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID GROUP - Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --id-red: #e41e28;
      --neutral-dark: #0f141b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f1f4f8 0%, #e8edf3 50%, #f6f8fb 100%);
      color: var(--neutral-dark);
      padding-top: 86px;
      min-height: 100vh;
    }

    .global-nav {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 120;
      padding: 0.7rem clamp(1rem, 3vw, 2rem);
      background: linear-gradient(180deg, rgba(5, 8, 14, 0.78), rgba(5, 8, 14, 0.28));
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-shell {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 2vw, 1.6rem);
      width: min(1200px, 100%);
      margin: 0 auto;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      color: #fff;
      text-decoration: none;
      padding: 0.35rem 0.6rem;
      border-radius: 12px;
      transition: background-color 0.25s ease, transform 0.25s ease;
    }

    .brand-mark img {
      width: 62px;
      height: auto;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.35));
    }

    .brand-mark:hover,
    .brand-mark:focus-visible {
      background: rgba(255, 255, 255, 0.05);
      transform: translateY(-1px);
      outline: none;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 0.12rem;
      line-height: 1.2;
    }

    .brand-name {
      display: block;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .brand-tag {
      color: rgba(244, 245, 247, 0.78);
      font-size: 0.9rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(0.6rem, 1.8vw, 1rem);
      flex: 1;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: rgba(244, 245, 247, 0.82);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.4rem 0.65rem;
      border-radius: 10px;
      transition: color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
      outline: none;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .icon-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.5rem 0.8rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: background-color 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
    }

    .icon-chip svg {
      width: 18px;
      height: 18px;
    }

    .icon-chip:hover,
    .icon-chip:focus-visible {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
      outline: none;
    }

    .icon-chip.subtle {
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-contact {
      background: rgba(228, 30, 40, 0.15);
      border-color: rgba(228, 30, 40, 0.45);
      color: #fff;
    }

    .nav-contact:hover,
    .nav-contact:focus-visible {
      background: rgba(228, 30, 40, 0.32);
      border-color: rgba(228, 30, 40, 0.6);
    }

    .page-shell {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 4rem) clamp(1.4rem, 5vw, 3rem) 4rem;
    }

    .page-card {
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(15, 20, 27, 0.08);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.08);
      padding: clamp(1.6rem, 3vw, 2.3rem);
      display: grid;
      gap: 0.85rem;
    }

    .eyebrow {
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 800;
      font-size: 0.82rem;
      color: rgba(15, 20, 27, 0.75);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 4vw, 2.8rem);
    }

    p {
      margin: 0;
      line-height: 1.6;
      color: rgba(15, 20, 27, 0.82);
    }

    .cta-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      width: fit-content;
      background: var(--id-red);
      color: #fff;
      text-decoration: none;
      padding: 0.85rem 1.35rem;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.14);
      transition: background-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .cta-link:hover,
    .cta-link:focus-visible {
      background: #c81a22;
      transform: translateY(-1px);
      outline: none;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.16);
    }

    .debug-tooltip {
      position: fixed;
      padding: 0.4rem 0.65rem;
      border-radius: 10px;
      background: rgba(9, 12, 18, 0.9);
      border: 1px solid rgba(228, 30, 40, 0.6);
      color: #fff;
      font-size: 0.85rem;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -140%);
      transition: opacity 0.12s ease;
      z-index: 140;
    }

    .debug-tooltip.is-visible {
      opacity: 1;
    }

    body.debug-active *:hover {
      outline: 1px dashed rgba(228, 30, 40, 0.7);
      outline-offset: 2px;
    }

    @media (max-width: 720px) {
      .nav-shell {
        flex-wrap: wrap;
      }

      .nav-links {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <header class="global-nav">
    <div class="nav-shell">
      <a class="brand-mark" href="index.html">
        <img src="logos/ID GROUP.png" alt="Logo ID GROUP">
        <div class="brand-text">
          <span class="brand-name">ID GROUP</span>
          <span class="brand-tag">Protection globale</span>
        </div>
      </a>
      <nav class="nav-links" aria-label="Navigation principale">
        <a href="index.html#intro">Accueil</a>
        <a href="index.html#universes">Nos univers</a>
        <a href="groupe.html">Groupe</a>
        <a href="engagements.html">Engagements</a>
        <a href="actualites.html">Actualités</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-chip" type="button" data-debug-toggle aria-pressed="false" title="Mode debug">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 16v-1.5M12 21v-3M16 16v-1.5" />
            <path d="M3 13h3l3 3h6l3-3h3" />
            <path d="M3 11h3l3-3h6l3 3h3" />
            <path d="M12 3v3" />
            <circle cx="12" cy="12" r="2" />
          </svg>
          <span>Debug</span>
        </button>
        <button class="icon-chip subtle" type="button" data-language-toggle title="Changer de langue">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" />
          </svg>
          <span class="lang-label">FR</span>
        </button>
        <a class="icon-chip nav-contact" href="contact.html" title="Prendre contact">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" />
            <path d="m4 7 8 5 8-5" />
          </svg>
          <span>Contact</span>
        </a>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="page-card">
      <p class="eyebrow">ID GROUP</p>
      <h1>Section en construction</h1>
      <p>Ce gabarit sert de base pour la navigation. Personnalisez ce contenu avec vos informations spécifiques.</p>
      <a class="cta-link" href="index.html">↩ Retour à l'accueil</a>
    </section>
  </main>

  <script>
    const debugToggle = document.querySelector('[data-debug-toggle]');
    const languageToggle = document.querySelector('[data-language-toggle]');
    const debugTooltip = document.createElement('div');
    debugTooltip.className = 'debug-tooltip';
    debugTooltip.setAttribute('role', 'status');
    document.body.appendChild(debugTooltip);

    let debugEnabled = false;

    function setDebugMode(state) {
      debugEnabled = state;
      document.body.classList.toggle('debug-active', debugEnabled);
      debugToggle?.setAttribute('aria-pressed', debugEnabled ? 'true' : 'false');
      debugTooltip.style.display = debugEnabled ? 'block' : 'none';
      if (!debugEnabled) {
        debugTooltip.classList.remove('is-visible');
      }
    }

    function updateDebugTooltip(event) {
      if (!debugEnabled) return;
      const tagName = event.target?.tagName?.toLowerCase();
      if (!tagName) return;
      debugTooltip.textContent = `<${tagName}>`;
      debugTooltip.style.left = `${event.clientX}px`;
      debugTooltip.style.top = `${event.clientY - 6}px`;
      debugTooltip.classList.add('is-visible');
    }

    function hideDebugTooltip() {
      debugTooltip.classList.remove('is-visible');
    }

    debugToggle?.addEventListener('click', () => setDebugMode(!debugEnabled));
    document.addEventListener('mousemove', updateDebugTooltip);
    document.addEventListener('mouseover', updateDebugTooltip);
    document.addEventListener('mouseleave', hideDebugTooltip);

    if (languageToggle) {
      const langLabel = languageToggle.querySelector('.lang-label');
      const languages = ['FR', 'EN'];
      let languageIndex = 0;

      languageToggle.addEventListener('click', () => {
        languageIndex = (languageIndex + 1) % languages.length;
        if (langLabel) {
          langLabel.textContent = languages[languageIndex];
        }
      });
    }
  </script>
</body>
</html>
